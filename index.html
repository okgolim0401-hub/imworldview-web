            fontFamily:'Inter,sans-serif', fontSize:`${fontSize}px`,
            fontVariationSettings:"'wght' 100", letterSpacing:'-0.01em',
            textTransform:'uppercase', whiteSpace:'nowrap', lineHeight:'0.8'
        });
        tmp.textContent = text;
        document.body.appendChild(tmp);
        const w = tmp.getBoundingClientRect().width;
        document.body.removeChild(tmp);
        return w;
    }

    function buildWall() {
        wall.innerHTML = '';
        const total = window.innerWidth > 768 ? 320 : 150;
        let ki = 0;
        for (let i = 0; i < total; i++) {
            const span = document.createElement('span');
            if (KW_POSITIONS.includes(i) && ki < 4) {
                span.textContent = KEYWORDS[ki];
                span.className   = 'intro-word keyword';
                span.id          = `kw-${KEYWORDS[ki].toLowerCase()}`;
                ki++;
            } else {
                span.textContent = filler[i % filler.length];
                span.className   = 'intro-word';
            }
            wall.appendChild(span);
        }
    }

    const delay = ms => new Promise(r => setTimeout(r, ms));

    async function run() {
        overlay.className = '';
        overlay.style.background = '#d11919';
        overlay.style.opacity = '1';
        document.querySelectorAll('.intro-flying').forEach(el => el.remove());
        document.getElementById('intro-cursor')?.remove();
        buildWall();

        const all = [...document.querySelectorAll('.intro-word')];
        const PER_WORD = 4;
        all.slice().sort(() => Math.random() - 0.5)
           .forEach((el, i) => setTimeout(() => el.classList.add('show'), i * PER_WORD));

        await delay((all.length - 1) * PER_WORD + 300);

        for (const k of ['i','am','world','view']) {
            document.getElementById(`kw-${k}`).classList.add('lit');
            await delay(450);
        }
        await delay(300);
        overlay.classList.add('dark-bg');
        await delay(500);
        ['i','am','world','view'].forEach(k =>
            document.getElementById(`kw-${k}`).classList.add('thin')
        );
        await delay(1050);
        shootToLine();
    }

    function shootToLine() {
        const keys = ['i','am','world','view'];
        const isMobile = window.innerWidth <= 768;
        const GAP = isMobile ? 10 : 22;
        const rects = {}, srcSizes = {};
        keys.forEach(k => {
            const el = document.getElementById(`kw-${k}`);
            rects[k]    = el.getBoundingClientRect();
            srcSizes[k] = parseFloat(window.getComputedStyle(el).fontSize);
        });
        const widths = {};
        keys.forEach(k => { widths[k] = measureWidth(WORD_TEXTS[k], srcSizes[k]); });
        const totalW = widths.i + widths.am + widths.world + widths.view + GAP * 2;
        const tX = {
            i:     (window.innerWidth - totalW) / 2,
            am:    (window.innerWidth - totalW) / 2 + widths.i + GAP,
            world: (window.innerWidth - totalW) / 2 + widths.i + GAP + widths.am + GAP,
            view:  (window.innerWidth - totalW) / 2 + widths.i + GAP + widths.am + GAP + widths.world
        };
        const tY = window.innerHeight / 2 - rects.i.height / 2;
        const clones = {};
        keys.forEach(k => {
            const el = document.getElementById(`kw-${k}`);
            const r  = rects[k];
            const clone = document.createElement('span');
            clone.textContent = WORD_TEXTS[k];
            clone.className   = 'intro-flying';
            Object.assign(clone.style, {
                fontSize: `${srcSizes[k]}px`,
                fontVariationSettings: "'wght' 100",
                letterSpacing: '-0.01em',
                top:  `${r.top}px`,
                left: `${r.left}px`
            });
            document.body.appendChild(clone);
            clones[k] = clone;
            el.style.cssText += ';transition:none!important;opacity:0!important;';
        });
        const EASING = 'cubic-bezier(0.86, 0, 0.07, 1)';
        keys.forEach((k, idx) => {
            const r = rects[k];
            clones[k].animate(
                [{ transform:'translate3d(0,0,0)' },
                 { transform:`translate3d(${tX[k]-r.left}px,${tY-r.top}px,0)` }],
                { duration:700, delay:idx*180, easing:EASING, fill:'forwards' }
            );
        });
        const shootTotal = (keys.length - 1) * 180 + 700;
        setTimeout(() => deletePhase({ clones, rects, srcSizes, widths, tX, tY, GAP }), shootTotal + 500);
    }

    function deletePhase({ clones, rects, srcSizes, widths, tX, tY, GAP }) {
        const cursorH  = rects.i.height;
        const widthOfA = measureWidth('A', srcSizes.am);
        const mWidth   = measureWidth('M', srcSizes.am);
        const newX = {
            m:     tX.i + widths.i,
            world: tX.i + widths.i + mWidth + GAP,
            view:  tX.i + widths.i + mWidth + GAP + widths.world
        };
        const fromDiffY = {
            m:     tY - rects.am.top,
            world: tY - rects.world.top,
            view:  tY - rects.view.top
        };
        const EASE2 = 'cubic-bezier(0.86, 0, 0.07, 1)';

        const cursor = document.createElement('div');
        cursor.id = 'intro-cursor';
        Object.assign(cursor.style, {
            left: `${tX.am + widthOfA}px`,
            top:  `${tY}px`,
            height: `${cursorH}px`
        });
        document.body.appendChild(cursor);

        setTimeout(() => {
            clones.am.textContent = 'M';
            cursor.style.left = `${tX.am}px`;

            setTimeout(() => {
                clones.am.animate([
                    { transform:`translate3d(${tX.am-rects.am.left}px,${fromDiffY.m}px,0)` },
                    { transform:`translate3d(${newX.m-rects.am.left}px,${fromDiffY.m}px,0)` }
                ], { duration:380, easing:EASE2, fill:'forwards' });
                clones.world.animate([
                    { transform:`translate3d(${tX.world-rects.world.left}px,${fromDiffY.world}px,0)` },
                    { transform:`translate3d(${newX.world-rects.world.left}px,${fromDiffY.world}px,0)` }
                ], { duration:380, easing:EASE2, fill:'forwards' });
                clones.view.animate([
                    { transform:`translate3d(${tX.view-rects.view.left}px,${fromDiffY.view}px,0)` },
                    { transform:`translate3d(${newX.view-rects.view.left}px,${fromDiffY.view}px,0)` }
                ], { duration:380, easing:EASE2, fill:'forwards' });

                cursor.style.animation = 'none';
                cursor.style.opacity   = '1';
                cursor.style.left = `${newX.m}px`;
                setTimeout(() => {
                    cursor.animate([{opacity:1},{opacity:0}], {duration:350, fill:'forwards'});
                    setTimeout(() => {
                        cursor.remove();
                        finishIntro();
                    }, 350);
                }, 420);
            }, 500);
        }, 650);
    }

    function finishIntro() {
        setTimeout(() => {
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            setTimeout(() => {
                overlay.remove();
                document.body.style.overflow = '';
            }, 1000);
        }, 400);
    }

    run();
})();
</script>
<script>
    function toggleMobileMenu() {
        const overlay = document.getElementById('mobile-menu-overlay');
        const line = document.getElementById('menu-line');
        if (!overlay || !line) return;
        
        const isHidden = overlay.classList.contains('opacity-0');
        if (isHidden) {
            overlay.classList.remove('pointer-events-none');
            overlay.classList.remove('opacity-0');
            overlay.classList.add('opacity-100');
            line.style.transform = 'scaleX(0.6)';
            line.style.backgroundColor = '#e2e2e2';
        } else {
            overlay.classList.add('pointer-events-none');
            overlay.classList.remove('opacity-100');
            overlay.classList.add('opacity-0');
            line.style.transform = 'scaleX(1)';
            line.style.backgroundColor = '#fff';
        }
    }
    document.getElementById('mobile-menu-trigger').addEventListener('click', toggleMobileMenu);

    function toggleLanguage(btn, lang) {
        document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.remove('active', 'text-primary');
            b.classList.add('text-outline');
        });
        btn.classList.remove('text-outline');
        btn.classList.add('active', 'text-primary');
        
        const koTexts = document.querySelectorAll('.mobile-ko-text');
        const enTexts = document.querySelectorAll('.mobile-en-text');
        
        if (lang === 'ko') {
            koTexts.forEach(t => t.classList.remove('hidden-lang'));
            enTexts.forEach(t => t.classList.add('hidden-lang'));
        } else {
            koTexts.forEach(t => t.classList.add('hidden-lang'));
            enTexts.forEach(t => t.classList.remove('hidden-lang'));
        }
    }
</script>
